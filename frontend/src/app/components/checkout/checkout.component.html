<div class="container py-5">
  
  <!-- Cabecera corregida para que resalte -->
  <div class="row mb-5">
    <div class="col-12 text-center text-md-start">
      <h2 class="display-6 fw-bold checkout-title d-flex align-items-center gap-3 justify-content-center justify-content-md-start">
        <i class="bi bi-cart-check"></i> Finalizar Compra
      </h2>
      <p class="checkout-subtitle fs-5">Completa tus datos para recibir tu pedido.</p>
    </div>
  </div>

  <div class="row g-5">
    <!-- Columna Izquierda: Formulario -->
    <div class="col-lg-7">
      <div class="card glass-card p-4 p-md-5">
        <h4 class="fw-bold mb-4 border-bottom pb-3 text-dark">
          <i class="bi bi-person-lines-fill me-2" style="color: #a06b3e;"></i>Datos de Entrega
        </h4>
        
        <form [formGroup]="checkoutForm" (ngSubmit)="confirmarPedido()">
          
          <div class="mb-4">
            <label class="form-label fw-bold text-secondary small text-uppercase">Nombre Completo</label>
            <input type="text" class="form-control form-control-lg bg-light border-0 shadow-sm" formControlName="clienteNombre" placeholder="Ej. Juan Pérez">
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold text-secondary small text-uppercase">Número de Celular</label>
            <input type="text" class="form-control form-control-lg bg-light border-0 shadow-sm" formControlName="celular" placeholder="Ej. 987654321">
          </div>

          <div class="mb-5">
            <label class="form-label fw-bold text-secondary small text-uppercase">Dirección de Entrega</label>
            <textarea class="form-control bg-light border-0 shadow-sm" formControlName="direccion" rows="3" placeholder="Ej. Av. Principal 123, Referencia..."></textarea>
          </div>

          <!-- Botón de Confirmación Mejorado -->
          <button type="submit" class="btn btn-checkout btn-lg w-100 rounded-pill fw-bold d-flex align-items-center justify-content-center gap-2" 
                  [disabled]="checkoutForm.invalid || cartItems.length === 0 || isSubmitting">
            <ng-container *ngIf="!isSubmitting">
              <i class="bi bi-shield-lock fs-5"></i> Confirmar y Pagar Orden
            </ng-container>
            <ng-container *ngIf="isSubmitting">
              <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              Procesando orden de forma segura...
            </ng-container>
          </button>
        </form>
      </div>
    </div>

    <!-- Columna Derecha: Resumen del Pedido con Miniaturas -->
    <div class="col-lg-5">
      <div class="card glass-card p-4">
        <h4 class="fw-bold mb-4 border-bottom pb-3 text-dark">
          <i class="bi bi-bag-check me-2" style="color: #a06b3e;"></i>Resumen de tu Orden
        </h4>
        
        <!-- Lista de productos con imágenes -->
        <ul class="list-group list-group-flush mb-4 bg-transparent">
          <li class="list-group-item bg-transparent px-0 py-3 d-flex justify-content-between align-items-center border-bottom border-secondary border-opacity-25" 
              *ngFor="let item of cartItems">
            
            <div class="d-flex align-items-center gap-3">
              <!-- MINIATURA DEL PRODUCTO CON REEMPLAZO INTELIGENTE -->
              <img [src]="getImagenUrl(item.producto.imagenUrl)" 
                   (error)="handleImageError($event)"
                   alt="{{item.producto.nombre}}" 
                   class="product-thumbnail">
              
              <!-- INFO DEL PRODUCTO -->
              <div>
                <h6 class="mb-0 fw-bold text-dark">{{item.producto.nombre}}</h6>
                <small class="text-muted">Cant: {{item.cantidad}} x ${{item.producto.precio}}</small>
              </div>
            </div>

            <!-- SUBTOTAL POR ITEM -->
            <span class="fw-bold text-dark fs-5">${{ (item.producto.precio * item.cantidad) }}</span>
          </li>
        </ul>

        <!-- Total General -->
        <div class="d-flex justify-content-between align-items-center pt-3 mt-auto bg-light p-3 rounded-4 border">
          <h5 class="fw-bold text-secondary mb-0">Total a Pagar:</h5>
          <h2 class="fw-black text-success mb-0 fw-bold">${{total}}</h2>
        </div>
      </div>
    </div>
  </div>
</div>
