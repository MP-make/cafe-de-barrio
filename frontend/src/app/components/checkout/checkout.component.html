<div class="container mt-4">
  <h2 class="text-center mb-4">Checkout</h2>
  <div class="row">
    <div class="col-md-8">
      <h4>Detalles del Pedido</h4>
      <ul class="list-group mb-3">
        <li class="list-group-item d-flex justify-content-between lh-sm" *ngFor="let item of cartItems">
          <div>
            <h6 class="my-0">{{item.producto.nombre}}</h6>
            <small class="text-muted">Cantidad: {{item.cantidad}}</small>
          </div>
          <span class="text-muted">${{item.producto.precio * item.cantidad}}</span>
        </li>
        <li class="list-group-item d-flex justify-content-between">
          <span>Total</span>
          <strong>${{total}}</strong>
        </li>
      </ul>
    </div>
    <div class="col-md-4">
      <h4>Información de Entrega</h4>
      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="clienteNombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="clienteNombre" [(ngModel)]="pedido.clienteNombre" name="clienteNombre" required>
        </div>
        <div class="mb-3">
          <label for="celular" class="form-label">Celular</label>
          <input type="text" class="form-control" id="celular" [(ngModel)]="pedido.celular" name="celular" required>
        </div>
        <div class="mb-3">
          <label for="direccion" class="form-label">Dirección</label>
          <textarea class="form-control" id="direccion" [(ngModel)]="pedido.direccion" name="direccion" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">Confirmar Pedido</button>
      </form>
    </div>
  </div>
</div>
