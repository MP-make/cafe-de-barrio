<div class="container mt-4 mb-5">
    <div class="card shadow-sm border-primary">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Nuevo Producto</h4>
      </div>
      <div class="card-body">
        <form [formGroup]="productoForm" (ngSubmit)="guardarProducto()">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">Nombre del Café *</label>
              <input type="text" class="form-control" formControlName="nombre">
            </div>
            <div class="col-md-6 mb-3" formGroupName="categoria">
              <label class="form-label fw-bold">Categoría *</label>
              <select class="form-select" formControlName="id">
                <option value="" disabled selected>Seleccione...</option>
                <option *ngFor="let c of categorias" [value]="c.id">{{c.nombre}}</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">Precio *</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" class="form-control" formControlName="precio">
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">Stock Inicial *</label>
              <input type="number" class="form-control" formControlName="stock">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">URL de la Imagen</label>
            <input type="text" class="form-control" formControlName="imagenUrl" placeholder="https://...">
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Descripción</label>
            <textarea class="form-control" formControlName="descripcion" rows="2"></textarea>
          </div>
          <div class="text-end">
            <button type="submit" class="btn btn-success px-4" [disabled]="productoForm.invalid">
              Guardar en Catálogo
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
