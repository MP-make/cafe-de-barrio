<div class="login-wrapper">
  <div class="background-overlay"></div>

  <div class="login-card shadow-lg">
    
    <div class="text-center mb-4">
      <img src="/logo.webp" alt="Logo" class="logo-img mb-3 shadow-sm">
      <h3 class="fw-bold title-text mb-0">CAFÉ DE BARRIO</h3>
      <p class="text-muted small mt-1">Accede a tu cuenta</p>
    </div>

    <div class="main-tabs d-flex mb-4">
      <button class="tab-btn" [class.active]="activeMainTab === 'CLIENTE'" (click)="setMainTab('CLIENTE')">Cliente</button>
      <button class="tab-btn" [class.active]="activeMainTab === 'ADMIN'" (click)="setMainTab('ADMIN')">Administrador</button>
    </div>

    <div *ngIf="activeMainTab === 'CLIENTE'" class="fade-in">
      
      <div class="sub-tabs d-flex mb-4 p-1 rounded-pill bg-light">
        <button class="sub-tab-btn rounded-pill w-50" [class.active]="activeClientTab === 'LOGIN'" (click)="setClientTab('LOGIN')">Ingresar</button>
        <button class="sub-tab-btn rounded-pill w-50" [class.active]="activeClientTab === 'REGISTER'" (click)="setClientTab('REGISTER')">Crear cuenta</button>
      </div>

      <form *ngIf="activeClientTab === 'LOGIN'" [formGroup]="loginForm" (ngSubmit)="onLogin()" class="fade-in">
        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary">Usuario</label>
          <input type="text" class="form-control form-control-lg bg-light" formControlName="username" placeholder="Tu usuario" autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-bold text-secondary">Contraseña</label>
          <input type="password" class="form-control form-control-lg bg-light" formControlName="password" placeholder="••••••••">
        </div>
        
        <div *ngIf="errorMessage" class="alert alert-danger py-2 small text-center">{{ errorMessage }}</div>
        <div *ngIf="successMessage" class="alert alert-success py-2 small text-center">{{ successMessage }}</div>

        <button type="submit" class="btn btn-premium-solid w-100 py-3" [disabled]="loginForm.invalid || isSubmitting">
          <span *ngIf="!isSubmitting">Ingresar</span>
          <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm"></span>
        </button>
      </form>

      <form *ngIf="activeClientTab === 'REGISTER'" [formGroup]="registerForm" (ngSubmit)="onRegister()" class="fade-in">
        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary">Usuario</label>
          <input type="text" class="form-control form-control-lg bg-light" formControlName="username" placeholder="Elige un usuario">
          <small *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched" class="text-danger">Mínimo 4 caracteres</small>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary">Contraseña</label>
          <input type="password" class="form-control form-control-lg bg-light" formControlName="password" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="mb-4">
          <label class="form-label small fw-bold text-secondary">Confirmar contraseña</label>
          <input type="password" class="form-control form-control-lg bg-light" formControlName="confirmPassword" placeholder="Repite tu contraseña">
          <small *ngIf="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched" class="text-danger d-block mt-1">Las contraseñas no coinciden</small>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger py-2 small text-center">{{ errorMessage }}</div>

        <button type="submit" class="btn btn-premium-solid w-100 py-3" [disabled]="registerForm.invalid || isSubmitting">
          <span *ngIf="!isSubmitting">Crear cuenta</span>
          <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm"></span>
        </button>
      </form>

    </div>

    <div *ngIf="activeMainTab === 'ADMIN'" class="fade-in">
      <div class="text-center mb-4">
        <span class="badge bg-dark text-warning border border-warning px-3 py-2 rounded-pill fw-medium">
          <i class="bi bi-shield-lock me-1"></i> Acceso exclusivo para personal
        </span>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary">Usuario Admin</label>
          <input type="text" class="form-control form-control-lg bg-light" formControlName="username" placeholder="ID de Empleado">
        </div>
        <div class="mb-4">
          <label class="form-label small fw-bold text-secondary">Contraseña</label>
          <input type="password" class="form-control form-control-lg bg-light" formControlName="password" placeholder="••••••••">
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger py-2 small text-center">{{ errorMessage }}</div>

        <button type="submit" class="btn btn-dark w-100 py-3 border border-warning text-warning fw-bold btn-admin" [disabled]="loginForm.invalid || isSubmitting">
          <span *ngIf="!isSubmitting">Ingresar como Admin</span>
          <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm text-warning"></span>
        </button>
      </form>
    </div>

  </div>
</div>
