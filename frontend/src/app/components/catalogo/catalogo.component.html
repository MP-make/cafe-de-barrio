<div class="container py-5">
  
  <div class="text-center mb-5">
    <h2 class="display-6 fw-bold text-white mb-2" style="letter-spacing: 1px;">NUESTRO CATÁLOGO</h2>
    <div class="accent-line mx-auto mb-3" style="width: 60px; height: 3px; background: #C5A059;"></div>
    <p class="text-white-50">Explora la selección de los mejores granos y métodos.</p>
  </div>

  <div class="row g-3 mb-4 justify-content-between align-items-center">
    <div class="col-md-6 col-lg-4">
      <div class="premium-search-box shadow-sm">
        <i class="bi bi-search icon text-warning"></i>
        <input type="text" class="form-control text-white" placeholder="Buscar por nombre..." [(ngModel)]="searchTerm" (input)="cd.detectChanges()">
      </div>
    </div>
    
    <div class="col-md-5 col-lg-3 text-md-end">
      <div class="premium-sort-box shadow-sm d-flex align-items-center">
        <i class="bi bi-filter-left icon text-warning me-2"></i>
        <select class="form-select border-0 bg-transparent shadow-none text-white" [(ngModel)]="sortOrder" (change)="cd.detectChanges()">
          <option value="default" class="text-dark">Relevancia</option>
          <option value="nombreAsc" class="text-dark">Nombre (A - Z)</option>
          <option value="precioAsc" class="text-dark">Precio: Menor a Mayor</option>
          <option value="precioDesc" class="text-dark">Precio: Mayor a Menor</option>
        </select>
      </div>
    </div>
  </div>

  <div class="category-pills-wrapper mb-5">
    <button class="category-pill shadow-sm" 
            [class.active]="selectedCategoria === null" 
            (click)="setCategoria(null)">
      Todas
    </button>
    <button class="category-pill shadow-sm" *ngFor="let cat of categorias"
            [class.active]="selectedCategoria === cat.id"
            (click)="setCategoria(cat.id)">
      {{cat.nombre}}
    </button>
  </div>

  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-warning" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-3 text-white-50 fw-bold">Preparando la selección...</p>
  </div>

  <div *ngIf="!isLoading" class="row g-3 g-md-4">
    <div class="col-6 col-md-4 col-lg-3" *ngFor="let p of filteredProductos">
      <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden cafe-card">
        
        <div class="position-relative overflow-hidden img-container">
          <img [src]="getImagenUrl(p.imagenUrl)" 
               (error)="manejarErrorImagen($event)"
               class="card-img-top object-fit-cover cafe-img" 
               alt="{{ p.nombre }}" 
               loading="lazy"
               (click)="openModal(p)"
               style="cursor: pointer;">
               
          <div class="position-absolute top-0 end-0 m-2 m-md-3">
            <span class="badge rounded-pill px-2 py-1 px-md-3 py-md-2 shadow-sm price-badge">
              ${{ p.precio }}
            </span>
          </div>
        </div>

        <div class="card-body d-flex flex-column p-3 p-md-4">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h5 class="card-title fw-bold text-white mb-0 text-truncate">{{p.nombre}}</h5>
          </div>
          
          <span class="stock-badge mb-2 d-inline-block">Stock: {{p.stock}} unid.</span>
          
          <p class="card-text text-white-50 flex-grow-1 small lh-base mb-3 product-desc">
            {{p.descripcion}}
          </p>
          
          <button class="btn w-100 rounded-pill fw-bold shadow-sm py-2 btn-add-cart" 
                  (click)="agregarAlCarrito(p)"
                  [disabled]="p.stock <= 0">
            <i class="bi bi-cart-plus me-1"></i> 
            <span class="btn-text" *ngIf="p.stock > 0">Añadir</span>
            <span class="btn-text" *ngIf="p.stock <= 0">Agotado</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <div *ngIf="!isLoading && filteredProductos.length === 0" class="text-center py-5 fade-in">
    <i class="bi bi-cup-hot fs-1 text-white-50 mb-3 d-block"></i>
    <h5 class="text-white-50 fw-light">No encontramos productos con esos filtros.</h5>
    <button class="btn btn-outline-light mt-3 rounded-pill px-4" (click)="searchTerm=''; setCategoria(null)">Limpiar filtros</button>
  </div>
</div>

<app-product-detail-modal 
  [producto]="selectedProducto" 
  [isOpen]="isModalOpen" 
  (closeModal)="closeModal()">
</app-product-detail-modal>
