<div class="container mt-4">
    <h2 class="text-center mb-4">☕ Catálogo de Café de Barrio</h2>
    <div class="mb-3">  <!-- Add this block -->
      <label for="categoriaSelect" class="form-label">Filtrar por categoría:</label>
      <select id="categoriaSelect" class="form-select" [(ngModel)]="selectedCategoria" (ngModelChange)="onCategoriaChange()">
        <option [ngValue]="null">Todas las categorías</option>
        <option *ngFor="let cat of categorias" [ngValue]="cat.id">{{cat.nombre}}</option>
      </select>
    <div class="row">
      <div class="col-md-4 mb-4" *ngFor="let p of productos">
        <div class="card shadow-sm h-100">
          <img [src]="p.imagenUrl || 'https://images.unsplash.com/photo-1559056199-641a0ac8b55e?q=80&w=300&h=200&auto=format&fit=crop'" 
               class="card-img-top" alt="Café">
          <div class="card-body">
            <h5 class="card-title">{{p.nombre}}</h5>
            <p class="card-text text-muted">{{p.descripcion}}</p><small class="text-muted">Stock: {{p.stock}}</small>
            <div class="d-flex justify-content-between align-items-center">
              <span class="badge bg-success fs-5">${{p.precio}}</span>
              <button class="btn btn-primary btn-sm">Añadir al carrito</button>
              <button class="btn btn-outline-danger btn-sm ms-2" (click)="eliminar(p.id)">
                <i class="bi bi-trash"></i>
                <button class="btn btn-primary btn-sm" (click)="agregarAlCarrito(p)">Añadir al carrito</button>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
